<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Seleksi - Pengumuman Hasil Seleksi Siswa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <header class="header">
                <h1 class="title">SMK MUHAMMADIYAH 1 KEPANJEN</h1>
                <p class="subtitle">Pengumuman Hasil Pemetaan</p>
            </header>
            
            <main class="main-content">
                <div class="student-info">
                    <p><strong>Nama:</strong> <span id="studentName">-</span></p>
                    <p><strong>No. Pendaftaran:</strong> <span id="studentUsername">-</span></p>
                    <p id="orangTuaRow" style="display: none;"><strong>Orang Tua/Wali:</strong> <span id="studentOrangTua">-</span></p>
                </div>
                
                <div id="resultStatus" class="result-status">
                    <!-- Status akan ditampilkan di sini -->
                </div>
                
                <div id="resultMessage" class="result-message">
                    <!-- Pesan akan ditampilkan di sini -->
                </div>
                
                <!-- Tombol Unduh PDF (hanya tampil untuk siswa yang LOLOS) -->
                <button id="downloadPdfBtn" class="btn-download-pdf" style="display: none;">Unduh Undangan Orang Tua (PDF)</button>
                
                <button id="logoutBtn" class="btn-logout">Logout</button>
            </main>
            
            <footer class="footer">
                <p>&copy; 2026 SMK Muhammadiyah 1 Kepanjen. All rights reserved.</p>
            </footer>
        </div>
    </div>
    
    <script src="script.js"></script>
    <script src="assets-surat.js"></script>
    <script src="jspdf.umd.min.js"></script>
</body>
</html>
